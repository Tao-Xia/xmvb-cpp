train:
  data_root: deepvbscf_data_f2_scan
  epochs: 300
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-6

  model_type: e3nn
  hidden_dim: 128
  pair_hidden_dim: 128
  atom_channels: 0
  ao_scalar_channels: 0
  lmax: 2
  num_radial: 8
  cutoff: 8.0

  device: cuda
  dtype: float32
  checkpoint: artifacts/deepVBH_f2_stage1.jax.pkl
  best_checkpoint: artifacts/deepVBH_f2_stage1.best.jax.pkl

  valid_fraction: 0.125
  test_fraction: 0.125
  split_seed: 0
  max_steps_per_sample: 100
  step_selection: first
  gradient_loss_interval: 1

  cache_steps: true
  preload_steps: true
  cache_device_samples: false
  fused_optimizer: true
  grad_clip_norm: 5.0
  normalize_losses: true
  matmul_precision: high
  allow_tf32: true

  hamiltonian_weight: 1.0
  energy_weight: 0.1
  gradient_mse_weight: 0.0
  gradient_direction_weight: 0.0
  gradient_target: residual

  scheduler: plateau
  lr_factor: 0.5
  lr_patience: 6
  min_lr: 1.0e-6
  seed: 0
