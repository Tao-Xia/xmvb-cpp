train:
  data_root: deepvbscf_data_f2_scan
  epochs: 60
  lr: 3.0e-4
  weight_decay: 1.0e-6

  model_type: e3nn
  hidden_dim: 128
  pair_hidden_dim: 128
  atom_channels: 0
  ao_scalar_channels: 0
  lmax: 2
  num_radial: 8
  cutoff: 8.0

  device: cuda
  dtype: float32
  init_checkpoint: artifacts/deepVBH_f2_stage1.best.pt
  checkpoint: artifacts/deepVBH_f2_stage2.pt
  best_checkpoint: artifacts/deepVBH_f2_stage2.best.pt

  valid_fraction: 0.125
  test_fraction: 0.125
  split_seed: 0
  max_steps_per_sample: 12
  step_selection: final
  gradient_loss_interval: 2

  cache_steps: true
  preload_steps: true
  cache_device_samples: true
  fused_optimizer: true
  grad_clip_norm: 5.0
  normalize_losses: true
  matmul_precision: high
  allow_tf32: true

  hamiltonian_weight: 1.0
  energy_weight: 0.1
  gradient_mse_weight: 1.0
  gradient_direction_weight: 0.1
  gradient_target: residual

  scheduler: plateau
  lr_factor: 0.5
  lr_patience: 6
  seed: 0
