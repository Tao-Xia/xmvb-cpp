train:
  data_root: deepvbscf_data_f2_scan
  epochs: 200
  batch_size: 8
  lr: 5.0e-5
  weight_decay: 1.0e-6

  model_type: e3nn
  hidden_dim: 128
  pair_hidden_dim: 128
  atom_channels: 0
  ao_scalar_channels: 0
  lmax: 2
  num_radial: 8
  cutoff: 8.0
  predict_reference_residual: false

  device: cuda
  dtype: float32
  init_checkpoint: artifacts/deepVBH_f2_stage3a_next_first.best.jax.pkl
  checkpoint: artifacts/deepVBH_f2_stage3b_rollout.jax.pkl
  best_checkpoint: artifacts/deepVBH_f2_stage3b_rollout.best.jax.pkl

  valid_fraction: 0.125
  test_fraction: 0.125
  split_seed: 0
  max_steps_per_sample: 8
  step_selection: first
  gradient_loss_interval: 4

  cache_steps: true
  preload_steps: true
  cache_device_samples: false
  fused_optimizer: true
  grad_clip_norm: 5.0
  normalize_losses: true
  matmul_precision: high
  allow_tf32: true

  hamiltonian_weight: 0.5
  energy_weight: 0.1
  orbital_residual_mse_weight: 1.0
  orbital_residual_direction_weight: 0.05
  orbital_residual_target: next
  rollout_steps: 3
  rollout_mse_weight: 0.5
  rollout_direction_weight: 0.05
  gradient_mse_weight: 0.0
  gradient_direction_weight: 0.0
  gradient_target: residual

  scheduler: plateau
  best_metric: rollout_rmse
  lr_factor: 0.5
  lr_patience: 10
  min_lr: 1.0e-6
  seed: 0
