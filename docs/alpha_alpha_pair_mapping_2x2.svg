<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title { font: 700 30px 'DejaVu Sans', Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 600 18px 'DejaVu Sans', Arial, sans-serif; fill: #374151; }
      .text { font: 15px 'DejaVu Sans', Arial, sans-serif; fill: #374151; }
      .small { font: 14px 'DejaVu Sans', Arial, sans-serif; fill: #4b5563; }
      .cell { font: 600 15px 'DejaVu Sans', Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .axis { font: 600 14px 'DejaVu Sans', Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .rowlabel { font: 600 14px 'DejaVu Sans', Arial, sans-serif; fill: #111827; text-anchor: end; dominant-baseline: middle; }
      .legend { font: 14px 'DejaVu Sans', Arial, sans-serif; fill: #111827; dominant-baseline: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="#fbfcfe"/>

  <text x="40" y="46" class="title">2x2 toy model: full determinant pairs projected to alpha-alpha pairs</text>
  <text x="40" y="78" class="subtitle">Determinants: D11=(a1,b1), D12=(a1,b2), D21=(a2,b1), D22=(a2,b2)</text>

  <rect x="40" y="105" width="610" height="685" rx="16" ry="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="70" y="140" class="subtitle">Ordered full determinant pairs</text>
  <text x="70" y="164" class="small">Row = left determinant, Column = right determinant</text>
  <text x="70" y="188" class="small">16 ordered full pairs -> 4 unique ordered alpha pairs</text>

  <rect x="770" y="105" width="590" height="685" rx="16" ry="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="800" y="140" class="subtitle">Unordered full determinant pairs</text>
  <text x="800" y="164" class="small">Upper triangle only, diagonal included</text>
  <text x="800" y="188" class="small">10 unordered full pairs -> 3 unique unordered alpha pairs</text>

  <rect x="70" y="220" width="18" height="18" fill="#cfe8ff" stroke="#9ca3af"/>
  <text x="98" y="229" class="legend">(a1,a1)</text>
  <rect x="170" y="220" width="18" height="18" fill="#d8f5c8" stroke="#9ca3af"/>
  <text x="198" y="229" class="legend">(a1,a2)</text>
  <rect x="270" y="220" width="18" height="18" fill="#ffe3c1" stroke="#9ca3af"/>
  <text x="298" y="229" class="legend">(a2,a1)</text>
  <rect x="370" y="220" width="18" height="18" fill="#ffd0d0" stroke="#9ca3af"/>
  <text x="398" y="229" class="legend">(a2,a2)</text>

  <rect x="800" y="220" width="18" height="18" fill="#cfe8ff" stroke="#9ca3af"/>
  <text x="828" y="229" class="legend">(a1,a1)</text>
  <rect x="900" y="220" width="18" height="18" fill="#d8f5c8" stroke="#9ca3af"/>
  <text x="928" y="229" class="legend">(a1,a2)</text>
  <rect x="1000" y="220" width="18" height="18" fill="#ffd0d0" stroke="#9ca3af"/>
  <text x="1028" y="229" class="legend">(a2,a2)</text>

  <text x="242" y="280" class="axis">right determinant</text>
  <text x="945" y="280" class="axis">right determinant</text>

  <text x="165" y="315" class="axis">D11</text>
  <text x="255" y="315" class="axis">D12</text>
  <text x="345" y="315" class="axis">D21</text>
  <text x="435" y="315" class="axis">D22</text>

  <text x="895" y="315" class="axis">D11</text>
  <text x="985" y="315" class="axis">D12</text>
  <text x="1075" y="315" class="axis">D21</text>
  <text x="1165" y="315" class="axis">D22</text>

  <text x="86" y="360" class="rowlabel">D11</text>
  <text x="86" y="450" class="rowlabel">D12</text>
  <text x="86" y="540" class="rowlabel">D21</text>
  <text x="86" y="630" class="rowlabel">D22</text>

  <text x="816" y="360" class="rowlabel">D11</text>
  <text x="816" y="450" class="rowlabel">D12</text>
  <text x="816" y="540" class="rowlabel">D21</text>
  <text x="816" y="630" class="rowlabel">D22</text>

  <text x="36" y="500" transform="rotate(-90 36 500)" class="axis">left determinant</text>
  <text x="766" y="500" transform="rotate(-90 766 500)" class="axis">left determinant</text>

  <rect x="120" y="330" width="90" height="90" fill="#cfe8ff" stroke="#6b7280"/>
  <rect x="210" y="330" width="90" height="90" fill="#cfe8ff" stroke="#6b7280"/>
  <rect x="300" y="330" width="90" height="90" fill="#d8f5c8" stroke="#6b7280"/>
  <rect x="390" y="330" width="90" height="90" fill="#d8f5c8" stroke="#6b7280"/>

  <rect x="120" y="420" width="90" height="90" fill="#cfe8ff" stroke="#6b7280"/>
  <rect x="210" y="420" width="90" height="90" fill="#cfe8ff" stroke="#6b7280"/>
  <rect x="300" y="420" width="90" height="90" fill="#d8f5c8" stroke="#6b7280"/>
  <rect x="390" y="420" width="90" height="90" fill="#d8f5c8" stroke="#6b7280"/>

  <rect x="120" y="510" width="90" height="90" fill="#ffe3c1" stroke="#6b7280"/>
  <rect x="210" y="510" width="90" height="90" fill="#ffe3c1" stroke="#6b7280"/>
  <rect x="300" y="510" width="90" height="90" fill="#ffd0d0" stroke="#6b7280"/>
  <rect x="390" y="510" width="90" height="90" fill="#ffd0d0" stroke="#6b7280"/>

  <rect x="120" y="600" width="90" height="90" fill="#ffe3c1" stroke="#6b7280"/>
  <rect x="210" y="600" width="90" height="90" fill="#ffe3c1" stroke="#6b7280"/>
  <rect x="300" y="600" width="90" height="90" fill="#ffd0d0" stroke="#6b7280"/>
  <rect x="390" y="600" width="90" height="90" fill="#ffd0d0" stroke="#6b7280"/>

  <text x="165" y="375" class="cell">(a1,a1)</text>
  <text x="255" y="375" class="cell">(a1,a1)</text>
  <text x="345" y="375" class="cell">(a1,a2)</text>
  <text x="435" y="375" class="cell">(a1,a2)</text>

  <text x="165" y="465" class="cell">(a1,a1)</text>
  <text x="255" y="465" class="cell">(a1,a1)</text>
  <text x="345" y="465" class="cell">(a1,a2)</text>
  <text x="435" y="465" class="cell">(a1,a2)</text>

  <text x="165" y="555" class="cell">(a2,a1)</text>
  <text x="255" y="555" class="cell">(a2,a1)</text>
  <text x="345" y="555" class="cell">(a2,a2)</text>
  <text x="435" y="555" class="cell">(a2,a2)</text>

  <text x="165" y="645" class="cell">(a2,a1)</text>
  <text x="255" y="645" class="cell">(a2,a1)</text>
  <text x="345" y="645" class="cell">(a2,a2)</text>
  <text x="435" y="645" class="cell">(a2,a2)</text>

  <text x="70" y="735" class="text">Counts:</text>
  <text x="140" y="735" class="text">(a1,a1) x 4, (a1,a2) x 4, (a2,a1) x 4, (a2,a2) x 4</text>
  <text x="70" y="760" class="text">This is the production-cache viewpoint: 16 ordered full pairs collapse to 4 directed alpha pairs.</text>

  <rect x="850" y="330" width="90" height="90" fill="#cfe8ff" stroke="#6b7280"/>
  <rect x="940" y="330" width="90" height="90" fill="#cfe8ff" stroke="#6b7280"/>
  <rect x="1030" y="330" width="90" height="90" fill="#d8f5c8" stroke="#6b7280"/>
  <rect x="1120" y="330" width="90" height="90" fill="#d8f5c8" stroke="#6b7280"/>

  <rect x="940" y="420" width="90" height="90" fill="#cfe8ff" stroke="#6b7280"/>
  <rect x="1030" y="420" width="90" height="90" fill="#d8f5c8" stroke="#6b7280"/>
  <rect x="1120" y="420" width="90" height="90" fill="#d8f5c8" stroke="#6b7280"/>

  <rect x="1030" y="510" width="90" height="90" fill="#ffd0d0" stroke="#6b7280"/>
  <rect x="1120" y="510" width="90" height="90" fill="#ffd0d0" stroke="#6b7280"/>

  <rect x="1120" y="600" width="90" height="90" fill="#ffd0d0" stroke="#6b7280"/>

  <text x="895" y="375" class="cell">(a1,a1)</text>
  <text x="985" y="375" class="cell">(a1,a1)</text>
  <text x="1075" y="375" class="cell">(a1,a2)</text>
  <text x="1165" y="375" class="cell">(a1,a2)</text>

  <text x="985" y="465" class="cell">(a1,a1)</text>
  <text x="1075" y="465" class="cell">(a1,a2)</text>
  <text x="1165" y="465" class="cell">(a1,a2)</text>

  <text x="1075" y="555" class="cell">(a2,a2)</text>
  <text x="1165" y="555" class="cell">(a2,a2)</text>

  <text x="1165" y="645" class="cell">(a2,a2)</text>

  <line x1="850" y1="420" x2="1210" y2="420" stroke="#9ca3af" stroke-dasharray="6 6"/>
  <line x1="940" y1="330" x2="940" y2="690" stroke="#9ca3af" stroke-dasharray="6 6"/>
  <line x1="850" y1="510" x2="1210" y2="510" stroke="#9ca3af" stroke-dasharray="6 6"/>
  <line x1="1030" y1="330" x2="1030" y2="690" stroke="#9ca3af" stroke-dasharray="6 6"/>
  <line x1="850" y1="600" x2="1210" y2="600" stroke="#9ca3af" stroke-dasharray="6 6"/>
  <line x1="1120" y1="330" x2="1120" y2="690" stroke="#9ca3af" stroke-dasharray="6 6"/>

  <text x="800" y="735" class="text">Counts:</text>
  <text x="870" y="735" class="text">(a1,a1) x 3, (a1,a2) x 4, (a2,a2) x 3</text>
  <text x="800" y="760" class="text">This is the scalar / symmetric viewpoint: 10 unordered full pairs collapse to 3 unique alpha pairs.</text>
</svg>
