[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepVBH"
version = "0.1.0"
description = "DeepVBH baselines for XMVB C++ trace data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
geom = [
  "e3nn>=0.5.7",
]
jax = [
  "jax>=0.5",
  "flax>=0.10",
  "grain>=0.2",
  "optax>=0.2",
  "orbax-checkpoint>=0.6",
  "e3nn-jax>=0.20",
]
jax-cuda12 = [
  "jax[cuda12]>=0.5",
  "flax>=0.10",
  "grain>=0.2",
  "optax>=0.2",
  "orbax-checkpoint>=0.6",
  "e3nn-jax>=0.20",
]
deploy = [
  "jax2onnx>=0.12",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "tensorflow>=2.17",
  "tf2onnx>=1.16",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
deepvbh-train = "deepVBH.train:main"
deepvbh-train-jax = "deepvbh.train_jax:main"
deepvbh-check-equivariance-jax = "deepVBH.check_equivariance_jax:main"
deepvbh-export-onnx = "deepVBH.export_onnx:main"

[tool.setuptools]
packages = ["deepvbh"]

[tool.uv]
package = true
