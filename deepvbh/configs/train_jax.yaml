runtime:
  jax_platforms: cuda
  disable_triton_gemm: true
  tf_cpp_min_log_level: "1"
  xla_flags_append: []
  xla_python_client_preallocate: false
  xla_python_client_mem_fraction: null
  xla_python_client_allocator: null

dataset:
  data_roots:
    - /export/home/xiatao/project/xmvb-cpp/data/matrix_data
  batch_size: 4096
  train_selected_steps: 5
  nonfinal_offdiagonal_pair_fraction: 0.5
  valid_fraction: 0.125
  test_fraction: 0.125
  split_seed: 0
  shuffle_seed: 0

model:
  d_model: 64
  num_heads: 4
  num_layers: 3
  mlp_hidden_dim: 256
  readout_hidden_dim: 64

optimizer:
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  schedule: cosine_with_warmup
  warmup_epochs: 50
  cosine_final_learning_rate_scale: 0.0

training:
  epochs: 5000
  seed: 0
  prefetch_batches: 2
  max_train_batches_per_epoch: null
  max_eval_batches: null
  console_every_n_epochs: 1

output:
  log_root: deepvbh/logs
  run_name_prefix: test
  checkpoint_filename: checkpoint.pkl
  metrics_json_filename: metrics.json
  csv_log_filename: train_metrics.csv
  metrics_jsonl_filename: train_metrics.jsonl
  text_log_filename: train.log
