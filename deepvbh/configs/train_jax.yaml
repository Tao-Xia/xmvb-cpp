runtime:
  jax_platforms: cuda
  disable_triton_gemm: true
  tf_cpp_min_log_level: "1"
  xla_flags_append: []
  xla_python_client_preallocate: false
  xla_python_client_mem_fraction: null
  xla_python_client_allocator: null

dataset:
  data_roots:
    - artifacts/c6h6_training_trace
    - artifacts/c6h6_full_training_trace
  target_key: target_hamiltonian
  batch_size: 1024
  step_selection: all
  max_steps_per_sample: 1
  valid_fraction: 0.125
  test_fraction: 0.125
  split_seed: 0
  shuffle_seed: 0
  upper_triangle_only: true
  exclude_diagonal: false

model:
  d_model: 64
  num_heads: 4
  num_layers: 3
  mlp_hidden_dim: 256
  readout_hidden_dim: 64

optimizer:
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  schedule: cosine_with_warmup
  warmup_epochs: 50
  cosine_final_learning_rate_scale: 0.0

training:
  epochs: 5000
  seed: 0
  max_train_batches_per_epoch: null
  max_eval_batches: null
  console_every_n_epochs: 1

output:
  log_root: deepvbh/logs
  run_name_prefix: deepvbh_f2_c6h6_c6h6full_uppertri_hamiltonian
  checkpoint_filename: checkpoint.pkl
  metrics_json_filename: metrics.json
  csv_log_filename: train_metrics.csv
